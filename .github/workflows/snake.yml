name: Contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#0f7f6c&color_dots=#ebedf0,#b8ebe2,#7fd8c8,#2bb7a0,#0f7f6c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2bb7a0&color_dots=#161b22,#0e4a40,#13705f,#1f9c86,#2bb7a0

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
